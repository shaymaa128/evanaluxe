<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brazilian Gold Accessories | EVANA LUXE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="announcement">EVANA LUXE — BRAZILIAN GOLD</div>

  <!-- Header with logo (left) and cart (upper right) is added by script.js -->

  <main>
    <section class="shop-section page-shop">
      <a href="showroom.html" class="back-link">← BACK TO SHOWROOM</a>

      <div class="section-heading">
        <p class="eyebrow">HANDPICKED FOR YOU</p>
        <h2>Brazilian Gold Accessories</h2>
        <p>Timeless gold pieces crafted with elegance.</p>
      </div>

      <div class="product-grid">

        <article class="product-card">
          <div class="product-image">
            <img src="images/brazilian-ring.jpg" alt="Brazilian gold ring">
          </div>
          <div class="product-info">
            <p class="category">RINGS</p>
            <h3>Brazilian Gold Ring</h3>
            <p class="price">$25.00</p>
            <label></label>
            <button class="add-button"
              data-name="Brazilian Gold Ring"
              data-image="images/brazilian-ring.jpg"
              data-price="25.00">
              Add to Cart
            </button>
          </div>
        </article>

      </div>

      <button type="button" id="doneButton" class="diamond-cart-button" aria-label="Go to cart">
        <span class="diamond-icon">♢</span>
        <span>VIEW MY BAG</span>
      </button>
    </section>
  </main>

  <footer>
    <p>Accessories that make you shine ✨</p>
    <p class="copyright">© 2026 Evana Luxe</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
