<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showroom | EVANA LUXE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .showroom-page {
            max-width: 1100px;
            margin: 45px auto;
            padding: 25px 20px;
            text-align: center;
        }

        .showroom-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            margin-top: 35px;
        }

        .showroom-card {
            display: block;
            overflow: hidden;
            border: 1px solid #8d702b;
            border-radius: 10px;
            color: #fff;
            text-decoration: none;
            background: #111;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .showroom-card:hover {
            transform: translateY(-4px);
            border-color: #d4af37;
        }

        .showroom-card img {
            display: block;
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .showroom-card h2 {
            color: #d4af37;
            padding: 18px 8px;
            margin: 0;
            font-size: 1.1rem;
        }

        .showroom-back {
            display: inline-block;
            color: #d4af37;
            text-decoration: none;
            margin-bottom: 25px;
        }

        @media (max-width: 650px) {
            .showroom-categories {
                grid-template-columns: 1fr;
            }

            .showroom-card img {
                height: 260px;
            }
        }
    </style>
</head>
<body>

    <div class="announcement">
        EVANA LUXE — EXPLORE OUR COLLECTION
    </div>

    <main class="showroom-page">
        <a href="index.html" class="showroom-back">← BACK TO HOME</a>

        <p class="eyebrow">DISCOVER YOUR STYLE</p>
        <h1 style="color: #d4af37;">Our Showroom</h1>
        <p>Explore our collections and find your next favorite piece.</p>

        <div class="showroom-categories">

            <!-- A picture inside <a href="..."> opens another page when clicked -->
            <a class="showroom-card" href="products.html?cat=accessories">
                <img src="images/accessories.jpg.jpg" alt="EVANA LUXE accessories">
                <h2>ACCESSORIES</h2>
            </a>

            <a class="showroom-card" href="products.html?cat=brazilian">
                <img src="images/braziliangold.jpg.jpg" alt="Brazilian gold accessories">
                <h2>BRAZILIAN GOLD ACCESSORIES</h2>
            </a>

            <a class="showroom-card" href="products.html?cat=perfumes">
                <img src="images/perfumes.jpg.jpg" alt="Discover our perfume collection">
                <h2>PERFUMES</h2>
            </a>

            <a class="showroom-card" href="products.html?cat=bags">
                <img src="images/bags.jpg.jpg" alt="Discover our bags collection">
                <h2>BAGS</h2>
            </a>
            <a class="showroom-card" href="products.html?cat=mens">
                <img src="images/mens-collection1.jpg.jpeg" alt="Men's Collection">
                <h2>MEN'S COLLECTION</h2>
            </a>

        </div>

    </main>

    <footer>
        <p>Accessories that make you shine ✨</p>
        <p class="copyright">© 2026 Evana Luxe</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
