<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection Manager | EVANA LUXE</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #000; color: #f3e9d2; font-family: Georgia, serif; }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { color: #d4af37; letter-spacing: 3px; font-size: 1.4rem; margin: 0 0 4px; }
  h2 { color: #d4af37; font-size: 1.1rem; margin: 28px 0 12px; border-left: 4px solid #d4af37; padding-left: 10px; }
  a { color: #d4af37; }
  .panel { background: #111; border: 1px solid #333; border-radius: 10px; padding: 16px; }
  label { display: block; margin: 10px 0 4px; font-size: .9rem; }
  input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #1c1c1c; color: #fff; font-size: 1rem; }
  .hint { font-size: .8rem; color: #aaa; margin-top: 3px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .row2 { grid-template-columns: 1fr; } }
  button { background: #d4af37; color: #000; border: 0; padding: 11px 22px; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 14px; }
  button.danger { background: #8b1a1a; color: #fff; margin-top: 8px; padding: 8px 14px; font-size: .9rem; }
  button:disabled { opacity: .5; cursor: wait; }
  .photo-row { display: grid; grid-template-columns: 70px 1fr 110px; gap: 10px; align-items: center; margin-top: 10px; background: #1a1a1a; padding: 8px; border-radius: 8px; }
  .photo-row img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; }
  .msg { margin-top: 10px; min-height: 1.2em; }
  .msg.err { color: #ff7b7b; } .msg.ok { color: #7bff9b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .card { background: #111; border: 1px solid #333; border-radius: 10px; overflow: hidden; }
  .card img { width: 100%; height: 170px; object-fit: cover; display: block; }
  .card .info { padding: 10px; font-size: .9rem; }
  .card .cat { color: #aaa; font-size: .75rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>EVANA LUXE — COLLECTION MANAGER</h1>
  <p><a href="collection.html">View collection page</a> · <a href="index.html">Back to shop</a></p>

  <h2>Add new items</h2>
  <div class="panel">
    <div class="row2">
      <div>
        <label for="category">Category (section name on the page)</label>
        <input id="category" list="categoryList" placeholder="e.g. New Collection" value="New Collection">
        <datalist id="categoryList"></datalist>
      </div>
      <div>
        <label for="tag">Small label above name (optional)</label>
        <input id="tag" placeholder="e.g. RINGS">
      </div>
    </div>
    <div class="row2">
      <div>
        <label for="optionLabel">Dropdown title (optional)</label>
        <input id="optionLabel" placeholder="e.g. Choose your ring">
      </div>
      <div>
        <label for="options">Options (separate with commas)</label>
        <input id="options" placeholder="Ring 1, Ring 2, Ring 3">
        <p class="hint">Leave empty for no dropdown.</p>
      </div>
    </div>

    <label for="photos">Photos (select several at once)</label>
    <input type="file" id="photos" accept="image/*" multiple>
    <p class="hint">Each photo becomes one item. Type the name and price for each below.</p>

    <div id="photoRows"></div>

    <button id="saveBtn" type="button">SAVE ITEMS</button>
    <p class="msg" id="msg"></p>
  </div>

  <h2>Saved items</h2>
  <div class="grid" id="saved"></div>
</div>

<script>
(function () {
  var DB_NAME = "evanaCollectionDB", STORE = "items";
  var $ = function (id) { return document.getElementById(id); };
  var pending = []; // {file, url}

  function openDB() {
    return new Promise(function (resolve, reject) {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () {
        r.result.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
      };
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }
  function dbRun(mode, fn) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(STORE, mode);
        var req = fn(t.objectStore(STORE));
        t.oncomplete = function () { resolve(req ? req.result : undefined); };
        t.onerror = t.onabort = function () { reject(t.error); };
      });
    });
  }

  function resize(file, max) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * s));
        c.height = Math.max(1, Math.round(img.naturalHeight * s));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) {
          URL.revokeObjectURL(url);
          b ? resolve(b) : reject(new Error("Could not process a photo."));
        }, "image/jpeg", 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("One file is not a valid picture.")); };
      img.src = url;
    });
  }

  function say(text, cls) { var m = $("msg"); m.textContent = text; m.className = "msg " + (cls || ""); }

  /* ----- photo rows ----- */
  $("photos").addEventListener("change", function () {
    pending.forEach(function (p) { URL.revokeObjectURL(p.url); });
    pending = Array.prototype.slice.call(this.files).map(function (f) {
      return { file: f, url: URL.createObjectURL(f) };
    });
    var box = $("photoRows");
    box.replaceChildren();
    pending.forEach(function (p, i) {
      var row = document.createElement("div");
      row.className = "photo-row";
      var img = document.createElement("img");
      img.src = p.url;
      var name = document.createElement("input");
      name.placeholder = "Item name";
      name.dataset.i = i; name.className = "pname";
      var price = document.createElement("input");
      price.type = "number"; price.step = "0.01"; price.min = "0";
      price.placeholder = "Price $"; price.className = "pprice";
      row.append(img, name, price);
      box.append(row);
    });
  });

  /* ----- save ----- */
  $("saveBtn").addEventListener("click", function () {
    var btn = this;
    if (!pending.length) { say("Choose at least one photo first.", "err"); return; }
    var category = $("category").value.trim();
    if (!category) { say("Please type a category name.", "err"); return; }
    var names = document.querySelectorAll(".pname");
    var prices = document.querySelectorAll(".pprice");
    for (var i = 0; i < pending.length; i++) {
      if (names[i].value.trim().length < 2) { say("Type a name for every photo.", "err"); return; }
      var pr = parseFloat(prices[i].value);
      if (!isFinite(pr) || pr < 0) { say("Type a valid price for every photo.", "err"); return; }
    }
    var options = $("options").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    btn.disabled = true; say("Saving…");

    var chain = Promise.resolve();
    pending.forEach(function (p, i) {
      chain = chain.then(function () { return resize(p.file, 900); }).then(function (blob) {
        var rec = {
          category: category,
          tag: $("tag").value.trim(),
          optionLabel: $("optionLabel").value.trim(),
          options: options,
          name: names[i].value.trim(),
          price: parseFloat(prices[i].value),
          image: blob,
          created: Date.now()
        };
        return dbRun("readwrite", function (s) { return s.add(rec); });
      });
    });
    chain.then(function () {
      say(pending.length + " item(s) saved. They now appear on the collection page.", "ok");
      pending.forEach(function (p) { URL.revokeObjectURL(p.url); });
      pending = [];
      $("photos").value = "";
      $("photoRows").replaceChildren();
      return renderSaved();
    }).catch(function (e) {
      say("Could not save: " + (e && e.message ? e.message : e), "err");
    }).then(function () { btn.disabled = false; });
  });

  /* ----- saved list ----- */
  var urls = [];
  function renderSaved() {
    return dbRun("readonly", function (s) { return s.getAll(); }).then(function (items) {
      urls.forEach(function (u) { URL.revokeObjectURL(u); });
      urls = [];
      var grid = $("saved");
      grid.replaceChildren();
      var cats = {};
      if (!items.length) {
        var p = document.createElement("p");
        p.textContent = "No saved items yet.";
        grid.append(p);
      }
      items.forEach(function (it) {
        cats[it.category] = true;
        var card = document.createElement("div");
        card.className = "card";
        var img = document.createElement("img");
        var u = URL.createObjectURL(it.image);
        urls.push(u);
        img.src = u;
        var info = document.createElement("div");
        info.className = "info";
        var cat = document.createElement("div"); cat.className = "cat"; cat.textContent = it.category;
        var nm = document.createElement("div"); nm.textContent = it.name;
        var pr = document.createElement("div"); pr.textContent = "$ " + Number(it.price).toFixed(2);
        var del = document.createElement("button");
        del.className = "danger"; del.type = "button"; del.textContent = "Delete";
        del.addEventListener("click", function () {
          if (!confirm("Delete \"" + it.name + "\"?")) return;
          dbRun("readwrite", function (s) { return s.delete(it.id); }).then(renderSaved);
        });
        info.append(cat, nm, pr, del);
        card.append(img, info);
        grid.append(card);
      });
      var dl = $("categoryList");
      dl.replaceChildren();
      Object.keys(cats).forEach(function (c) {
        var o = document.createElement("option"); o.value = c; dl.append(o);
      });
    });
  }

  renderSaved().catch(function (e) {
    say("Your browser could not open storage: " + (e && e.message ? e.message : e), "err");
  });
})();
</script>
</body>
</html>
