<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men | EVANA LUXE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .showroom-page { max-width: 900px; margin: 45px auto; padding: 25px 20px; text-align: center; }
        .showroom-back { display: inline-block; color: #8b5a2b; text-decoration: none; margin-bottom: 25px; }
        .showroom-categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; margin-top: 35px; }
        .showroom-card { display: block; overflow: hidden; border: 1px solid #dcc7b0; border-radius: 10px; color: #3b2a20; text-decoration: none; background: rgba(255,255,255,0.92); transition: transform .2s ease, border-color .2s ease; }
        .showroom-card:hover { transform: translateY(-4px); border-color: #8b5a2b; }
        .showroom-card h2 { color: #8b5a2b; padding: 90px 8px; margin: 0; font-size: 1.3rem; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div class="announcement">EVANA LUXE — MEN</div>

    <main class="showroom-page">
        <a href="showroom.html" class="showroom-back">← BACK TO SHOWROOM</a>

        <p class="eyebrow">DISCOVER YOUR STYLE</p>
        <h1 style="color: #8b5a2b;">Men</h1>

        <div class="showroom-categories">
            <a class="showroom-card" href="products.html?cat=men-clothes">
                <h2>Men&rsquo;S CLOTHES</h2>
            </a>
            <a class="showroom-card" href="products.html?cat=men-shoes">
                <h2>Men&rsquo;S SHOES</h2>
            </a>
        </div>
    </main>

    <footer>
        <p>Accessories that make you shine ✨</p>
        <p class="copyright">© 2026 Evana Luxe</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
